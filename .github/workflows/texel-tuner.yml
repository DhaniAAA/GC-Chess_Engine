name: Texel Tuner

on:
  workflow_dispatch:
    inputs:
      tuner_type:
        description: "Tuner type (texel or spsa)"
        required: true
        default: "texel"
        type: choice
        options:
          - texel
          - spsa
      max_positions:
        description: "Maximum positions to use (Texel: 50000-2000000, SPSA: FEN count)"
        required: true
        default: "500000"
      iterations:
        description: "Number of tuning iterations (10-200)"
        required: true
        default: "100"

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 720 # 6 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make python3

      - name: Download EPD dataset
        run: |
          mkdir -p tuner
          if [ ! -f tuner/quiet-labeled.epd ]; then
            echo "Downloading quiet-labeled.epd..."
            wget -q "https://github.com/official-stockfish/Stockfish/raw/master/src/../../../wiki/Texel-tuning-resources/quiet-labeled.epd" -O tuner/quiet-labeled.epd 2>/dev/null || \
            echo "Using existing EPD file or download from your source"
          fi
          if [ -f tuner/quiet-labeled.epd ]; then
            wc -l tuner/quiet-labeled.epd
          else
            echo "WARNING: EPD file not found. Please ensure tuner/quiet-labeled.epd is in the repository."
          fi

      - name: Build Engine & Tuner
        run: |
          echo "Building with optimizations..."
          if [ "${{ github.event.inputs.tuner_type }}" = "texel" ]; then
            make tuner CXX=g++ CXXFLAGS="-std=c++17 -O3 -march=native -DNDEBUG -pthread"
          else
            make CXX=g++ CXXFLAGS="-std=c++17 -O3 -march=native -DNDEBUG -pthread"
          fi

      - name: Run Texel Tuner
        if: ${{ github.event.inputs.tuner_type == 'texel' }}
        run: |
          echo "Starting Texel Tuning..."
          echo "Positions: ${{ github.event.inputs.max_positions }}"
          echo "Iterations: ${{ github.event.inputs.iterations }}"
          echo ""
          ./output/tuner tuner/quiet-labeled.epd ${{ github.event.inputs.max_positions }} ${{ github.event.inputs.iterations }} | tee tuning_results.txt

      - name: Run SPSA Tuner
        if: ${{ github.event.inputs.tuner_type == 'spsa' }}
        run: |
          echo "Starting SPSA Tuning..."
          echo "FEN Count: ${{ github.event.inputs.max_positions }}"
          echo "Iterations: ${{ github.event.inputs.iterations }}"
          echo ""
          python3 tuner/spsa_tuner.py \
            --engine ./output/main \
            --simple \
            --iterations ${{ github.event.inputs.iterations }} \
            --fen-count ${{ github.event.inputs.max_positions }} \
            --positions-per-iter 30 \
            --search-depth 6 \
            --output tuning_results.json \
            | tee tuning_results.txt

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: tuning-results-${{ github.event.inputs.tuner_type }}
          path: |
            tuning_results.txt
            tuning_results.json
            spsa_results.json
          retention-days: 30

      - name: Display Final Values
        run: |
          echo "============================================"
          echo "TUNING COMPLETE (${{ github.event.inputs.tuner_type }})"
          echo "============================================"
          if [ "${{ github.event.inputs.tuner_type }}" = "texel" ]; then
            grep -A 50 "FINAL TUNED VALUES" tuning_results.txt || true
          else
            grep -A 50 "TUNING COMPLETE" tuning_results.txt || true
          fi
